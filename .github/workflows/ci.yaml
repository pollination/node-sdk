name: CI

on:
  pull_request:
    branches:
      - "master"
      - "*beta*"
  push:
    branches:
      - "master"
      - "*beta*"

jobs:
  deploy:
    name: "Push to NPM"
    if: success()
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@latest
      - name: Install dependencies
        run: npm install
      - name: Build Package
        run: npm run build
      - name: Publish Package
        run: |
          pat=".*beta.*"
          if [[ $GITHUB_REF =~ $pat ]];
            then
              npm publish --tag beta --access public
            else
              npm publish --access public
          fi

  documentation:
    name: Deploy Docs
    needs: deploy
    if: success() && github.ref == 'refs/heads/master' && github.base_ref == ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install dependencies
        run: npm install
        env:
          NPM_TOKEN: $

      - name: Install typescript globally
        run: npm install -g typescript

      - name: Install typedoc
        run: npm i -g typedoc
        env:
          NPM_TOKEN: $

      - name: Build Docs
        run: typedoc index.ts

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: $
          branch: gh-pages
          folder: docs
